<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="icon-blue-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A58CA" />
      <stop offset="100%" stop-color="#003380" />
    </linearGradient>
    
    <linearGradient id="icon-green-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#0D7A56" />
    </linearGradient>

    <!-- Clean Drop Shadow -->
    <filter id="icon-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="100%" height="100%" fill="#FFFFFF" rx="40" />

  <g transform="translate(10, 5)">
    <!-- Outer "D" Structure (Trust Blue) -->
    <path d="M 40,25 
             H 95 
             C 145,25 175,55 175,100 
             C 175,145 145,175 95,175 
             H 40 
             Z" 
          fill="none" 
          stroke="url(#icon-blue-grad)" 
          stroke-width="20" 
          stroke-linejoin="round" 
          stroke-linecap="round"
          filter="url(#icon-shadow)"/>

    <!-- Inner Rising Flow Arrow (Growth Green) -->
    <path d="M 40,145 
             C 70,145 80,115 95,95 
             L 140,45" 
          fill="none" 
          stroke="url(#icon-green-grad)" 
          stroke-width="18" 
          stroke-linecap="round" /> 
          
    <!-- Arrowhead -->
    <path d="M 108,40 
             H 148 
             V 80" 
          fill="none" 
          stroke="url(#icon-green-grad)" 
          stroke-width="18" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Accent Data & Alert Nodes -->
    <circle cx="40" cy="145" r="11" fill="#FF9F1C" />
    <circle cx="95" cy="95" r="8" fill="#10B981" />
  </g>
</svg>
